# ============================================================
# 基本設定
# ============================================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
setw -g aggressive-resize on

# ESCの遅延をなくす
set -sg escape-time 0

# インデックスを1始まりに
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ============================================================
# プレフィックスキー: C-q
# ============================================================
unbind C-b
set -g prefix C-q
bind C-q send-prefix

# ============================================================
# 設定リロード
# ============================================================
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ============================================================
# ウィンドウ・ペイン操作
# ============================================================
# 分割: | と - (カレントパスを引き継ぐ)
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 新ウィンドウもカレントパスから
bind c new-window -c "#{pane_current_path}"

# ペイン移動: vim風 (hjkl)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# ペインリサイズ
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================================
# マウス
# ============================================================
set -g mouse on

# ============================================================
# コピーモード (vi風)
# ============================================================
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ============================================================
# ステータスバー (Solarized Dark)
# ============================================================
set -g status on
set -g status-position bottom
set -g status-justify left

set -g status-style "bg=#073642 fg=#839496"

# 左: セッション名
set -g status-left-length 30
set -g status-left "#[bg=#268bd2,fg=#fdf6e3,bold] #S #[bg=#073642,fg=#268bd2]"

# 右: 日時
set -g status-right-length 50
set -g status-right "#[fg=#586e75] %Y-%m-%d  %H:%M "

# ウィンドウタブ
setw -g window-status-format " #I:#W "
setw -g window-status-style "fg=#586e75"
setw -g window-status-current-format "#[bg=#b58900,fg=#073642,bold] #I:#W #[bg=#073642,fg=#b58900]"

# ペインボーダー
set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#268bd2"
