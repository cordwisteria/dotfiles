# Solarized Dark カラースキームに合わせたStarship設定

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# ============================================================
# OS アイコン
# ============================================================
[os]
disabled = false
style = "fg:#586e75"

[os.symbols]
Macos = "  "
Windows = "  "
Ubuntu = "  "
Debian = "  "

# ============================================================
# ディレクトリ
# ============================================================
[directory]
style = "bold fg:#268bd2"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"

# ============================================================
# Git
# ============================================================
[git_branch]
symbol = " "
style = "fg:#b58900"
format = "[$symbol$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "fg:#dc322f"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
deleted = "✘${count}"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "fg:#cb4b16"

# ============================================================
# 言語バージョン (アクティブな時だけ表示)
# ============================================================
[nodejs]
symbol = " "
style = "fg:#859900"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "fg:#859900"
format = '[$symbol$version(\($virtualenv\))]($style) '

[rust]
symbol = " "
style = "fg:#cb4b16"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "fg:#2aa198"
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
style = "fg:#268bd2"
format = "[$symbol$context]($style) "
only_with_files = true

# ============================================================
# コマンド実行時間
# ============================================================
[cmd_duration]
min_time = 2_000
format = "[⏱ $duration]($style) "
style = "fg:#586e75"

# ============================================================
# プロンプト文字
# ============================================================
[character]
success_symbol = "[❯](bold fg:#859900)"
error_symbol = "[❯](bold fg:#dc322f)"
